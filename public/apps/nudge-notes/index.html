<script>
window.BUDDY = {
  id: "nudge",

  tagline: "Remember more. Stress less.",
  emoji: "⏰",

  subjects: [{"s": "Reminders", "label": "Reminders"}, {"s": "Routines", "label": "Routines"}, {"s": "Schedules", "label": "Schedules"}, {"s": "Important dates", "label": "Important dates"}, {"s": "Chores", "label": "Chores"}, {"s": "tip", "label": "Quick tip", "tip": true}],
